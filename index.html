<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HP GTM AI Vision × Glean</title>
<style>
  :root{
    --artifact-bg: var(--theme-background, #f6f5f2);
    --artifact-surface: var(--theme-background-light, #ffffff);
    --artifact-surface-2: var(--theme-background-light, #f0efeb);
    --artifact-text: var(--theme-text-primary, #191d27);
    --artifact-text-soft: var(--theme-text-secondary, #5b6473);
    --artifact-accent: var(--theme-primary-highlight, #0f6b95);
    --artifact-accent-soft: rgba(15,107,149,0.09);
    --artifact-border: rgba(25,29,39,0.11);
    --artifact-rule: rgba(15,107,149,0.35);
    --artifact-card-shadow: 0 1px 2px rgba(25,29,39,0.05), 0 10px 34px rgba(25,29,39,0.05);
    --artifact-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --artifact-serif: Georgia, "Times New Roman", serif;
  }
  html[data-theme='dark']{
    --artifact-bg: var(--theme-background, #0d1016);
    --artifact-surface: var(--theme-background-light, #151a22);
    --artifact-surface-2: var(--theme-background-light, #1a212b);
    --artifact-text: var(--theme-text-primary, #eef1f5);
    --artifact-text-soft: var(--theme-text-secondary, #9aa4b4);
    --artifact-accent: var(--theme-primary-highlight, #4bb4e0);
    --artifact-accent-soft: rgba(75,180,224,0.12);
    --artifact-border: rgba(255,255,255,0.11);
    --artifact-rule: rgba(75,180,224,0.4);
    --artifact-card-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 12px 40px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0; background:var(--artifact-bg); color:var(--artifact-text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:960px; margin:0 auto; padding:0 28px;}
  a{color:var(--artifact-accent); text-decoration:none;}
  .rv{opacity:0; transform:translateY(12px); animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;}
  @keyframes rise{to{opacity:1; transform:none;}}
  .d1{animation-delay:.05s}.d2{animation-delay:.13s}.d3{animation-delay:.21s}.d4{animation-delay:.29s}.d5{animation-delay:.37s}

  .hero{padding:74px 0 40px;}
  .kicker{font-family:var(--artifact-mono); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--artifact-accent); margin:0 0 20px;}
  h1{font-family:var(--artifact-serif); font-size:clamp(30px,4.6vw,48px); line-height:1.1; font-weight:600; letter-spacing:-.015em; margin:0 0 20px; max-width:19ch;}
  .sub{font-size:18px; color:var(--artifact-text-soft); max-width:680px; margin:0 0 24px;}
  .attrib{font-size:13px; color:var(--artifact-text-soft); border-top:1px solid var(--artifact-border); padding-top:16px; display:flex; flex-wrap:wrap; gap:6px 18px;}
  .attrib b{color:var(--artifact-text); font-weight:600;}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin:8px 0 4px; border:1px solid var(--artifact-border); border-radius:14px; overflow:hidden; background:var(--artifact-surface); box-shadow:var(--artifact-card-shadow);}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr);}}
  .stat{padding:22px 22px;}
  .stat+.stat{border-left:1px solid var(--artifact-border);}
  @media(max-width:760px){.stat:nth-child(3){border-left:none; border-top:1px solid var(--artifact-border);} .stat:nth-child(4){border-top:1px solid var(--artifact-border);}}
  .stat .n{font-family:var(--artifact-serif); font-size:27px; font-weight:600; letter-spacing:-.02em; line-height:1; color:var(--artifact-accent);}
  .stat .l{font-size:12.5px; color:var(--artifact-text-soft); margin-top:9px; line-height:1.4;}

  section{padding:42px 0;}
  .sec-label{display:flex; align-items:center; gap:14px; font-family:var(--artifact-mono); font-size:11.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--artifact-text-soft); margin:0 0 22px;}
  .sec-label::before{content:""; width:26px; height:2px; background:var(--artifact-rule);}
  h2{font-family:var(--artifact-serif); font-size:clamp(22px,3vw,30px); font-weight:600; letter-spacing:-.015em; margin:0 0 14px;}

  .throughline{background:var(--artifact-surface); border:1px solid var(--artifact-border); border-radius:18px; padding:34px 36px; box-shadow:var(--artifact-card-shadow);}
  .throughline p{font-size:16px; color:var(--artifact-text-soft); max-width:720px; margin:0 0 16px;}
  .quote{font-family:var(--artifact-serif); border-left:3px solid var(--artifact-rule); padding:6px 0 6px 20px; margin:22px 0; font-size:19px; font-style:italic; color:var(--artifact-text); max-width:680px; line-height:1.45;}

  .pillar{background:var(--artifact-surface); border:1px solid var(--artifact-border); border-radius:18px; margin-bottom:20px; box-shadow:var(--artifact-card-shadow); overflow:hidden;}
  .pillar-top{display:flex; align-items:flex-start; gap:20px; padding:26px 32px 20px;}
  .pnum{flex:0 0 auto; width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-family:var(--artifact-serif); font-weight:600; font-size:22px; color:var(--artifact-accent); background:var(--artifact-accent-soft); border:1px solid var(--artifact-border);}
  .ptitle{font-family:var(--artifact-serif); font-size:21px; font-weight:600; letter-spacing:-.01em; margin:5px 0 6px;}
  .pgoal{font-size:14.5px; color:var(--artifact-text-soft); margin:0;}
  .pbody{display:grid; grid-template-columns:1.15fr 1fr; gap:0; border-top:1px solid var(--artifact-border);}
  @media(max-width:800px){.pbody{grid-template-columns:1fr;}}
  .pcol{padding:24px 32px;}
  .pcol+.pcol{border-left:1px solid var(--artifact-border);}
  @media(max-width:800px){.pcol+.pcol{border-left:none; border-top:1px solid var(--artifact-border);}}
  .colhead{font-family:var(--artifact-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--artifact-text-soft); margin:0 0 14px;}
  ul.gl{margin:0; padding:0; list-style:none;}
  ul.gl li{position:relative; padding:0 0 12px 22px; font-size:14.5px;}
  ul.gl li::before{content:""; position:absolute; left:2px; top:9px; width:6px; height:6px; border-radius:50%; background:var(--artifact-accent);}
  ul.gl li:last-child{padding-bottom:0;}
  ul.gl li b{font-weight:620;}
  .stories{display:flex; flex-direction:column; gap:12px;}
  .story{display:block; background:var(--artifact-surface-2); border:1px solid var(--artifact-border); border-radius:12px; padding:15px 16px; color:inherit; transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;}
  a.story:hover{transform:translateY(-2px); box-shadow:var(--artifact-card-shadow); border-color:var(--artifact-rule);}
  .stop{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:5px;}
  .sname{font-weight:640; font-size:15px;}
  .smetric{font-family:var(--artifact-mono); font-size:12px; font-weight:600; color:var(--artifact-accent); white-space:nowrap; display:inline-flex; align-items:center; gap:6px;}
  .sdesc{font-size:13.5px; color:var(--artifact-text-soft); margin:0 0 8px;}
  .slink{font-size:12.5px; font-weight:600; color:var(--artifact-accent); display:inline-flex; align-items:center; gap:5px;}
  .slink::after{content:"→"; transition:transform .16s ease;}
  a.story:hover .slink::after{transform:translateX(3px);}

  .help{background:var(--artifact-surface); border:1px solid var(--artifact-border); border-radius:18px; padding:32px 36px; box-shadow:var(--artifact-card-shadow);}
  .help p.lead{font-size:16px; color:var(--artifact-text-soft); max-width:740px; margin:0 0 20px;}

  .close{background:var(--artifact-accent-soft); border:1px solid var(--artifact-border); border-radius:18px; padding:30px 36px; text-align:center;}
  .close h2{margin-bottom:10px;}
  .close p{font-size:15.5px; color:var(--artifact-text-soft); max-width:620px; margin:0 auto;}

  .foot{font-size:12.5px; color:var(--artifact-text-soft); padding:24px 0 60px; border-top:1px solid var(--artifact-border); margin-top:8px; text-align:center;}
  .no-data{padding:80px 20px; text-align:center; color:var(--artifact-text-soft); font-size:16px;}

  @media print{
    body{margin:0; padding:0.4in 0.55in; background:#fff; print-color-adjust:exact; -webkit-print-color-adjust:exact;}
    .wrap{max-width:100%!important;}
    .hero{padding:16px 0;}
    section{padding:16px 0;}
    .pillar,.stats,.throughline,.help,.close,.story{break-inside:avoid; box-shadow:none!important; border:1px solid rgba(0,0,0,0.10);}
    .rv{opacity:1!important; transform:none!important; animation:none!important;}
    button,[role="button"]{display:none!important;}
    *,*::before,*::after{animation:none!important; transition:none!important;}
  }
</style>

ve", "url": "https://www.glean.com/resources/customer-stories/motive", "metric": "75% less time on account plans", "desc": "Motive's GTM team uses a Glean agent to build strategic account plans from CRM, news, and Slack."}]}, {"num": "3", "title": "Net New Business", "goal": "Close blind spots and lift the share of net-new customers through sharper outreach and SDR motion.", "how": ["<b>Speeds prospect research.</b> Glean pulls public and internal signals into one brief, so SDRs prep an account in minutes instead of hours.", "<b>Drafts outreach that lands.</b> It writes personalized messages grounded in the account's context and the rep's voice, ready to review and send.", "<b>Ramps new reps and complements your stack.</b> Playbooks, cases, and objection handling are one question away, and Glean feeds enriched context into outreach tools rather than replacing them."], "id": "newbiz", "stories": [{"name": "TIME", "url": "https://www.glean.com/resources/customer-stories/time", "metric": "Up and running in 3 weeks", "desc": "TIME indexed over 100 years of articles and accelerated sales and editorial research with Glean."}]}, {"num": "4", "title": "Lead-to-Cash Processes", "goal": "Bring old, unconnected quote, contract, and billing systems into one connected flow, the pillar you're still shaping.", "how": ["<b>Answers invoice and PO questions across systems.</b> Ask for every invoice tied to a purchase order and get one clean table pulled live from your billing and ERP records, so finance stops exporting and reconciling by hand and can skip a separate point tool.", "<b>Standardizes contracts and surfaces risk.</b> Glean reads across your quote and contract repositories to check terms against your standards, flag non-standard clauses and pricing, and pull the exact language a rep or approver needs in the moment.", "<b>Automates the billing handoffs that break today.</b> Agents reconcile order-to-invoice status, draft quote and contract summaries, calculate and check billing details, and route the exceptions, each step following the user's access.", "<b>Lets you start now, decide later.</b> Because Glean is a layer on top rather than a replacement, HP can capture value across these disconnected systems while the longer-term lead-to-cash architecture is still being chosen, and the same context also strengthens the other three pillars."], "id": "lead2cash", "stories": [{"name": "Confluent", "url": "https://www.glean.com/resources/customer-stories/confluent", "metric": "15k+ hours saved monthly", "desc": "Confluent uses Glean to help employees find information across 20+ systems."}]}], "help": {"label": "How we'd approach it with HP", "lead": "Across all four priorities, Glean is the connected context layer that makes your existing tools and any models you build work better together, rather than one more system to buy and integrate.", "bullets": ["<b>Start where value comes fastest.</b> Lead-to-cash is the most open area, and Glean can add value across those disconnected systems right away without a rip-and-replace.", "<b>Build alongside, not against.</b> On funnel and install-base management, Glean sits on top of your Databricks work as the context and orchestration layer.", "<b>One secure layer across everything.</b> Glean connects your structured and unstructured data and follows each person's permissions down to the document, so answers are both complete and safe.", "<b>Freedom to choose the best model.</b> Your teams use the right model for each task, grounded in one enterprise context, keeping HP flexible as the technology evolves."]}, "close": {"title": "Let's take a closer look together", "body": "A short working session to map your environment would show exactly where Glean fits across these four priorities. We'd also love to have you join Glean:GO on August 26–27, in person in San Francisco or virtually, to see how leaders like Dell and Databricks are transforming their go-to-market with Glean."}, "footer": "Glean · Work AI <body>
<div id="app"></div>

<script>
  function esc(s){ return (s==null?'':String(s)); }

  function renderApp(d){
    var pillars = (d.pillars||[]).map(function(p){
      var how = (p.how||[]).map(function(h){ return '<li>'+h+'</li>'; }).join('');
      var stories = (p.stories||[]).map(function(s){
        return '<a class="story" href="'+esc(s.url)+'" target="_blank" rel="noopener">'
          + '<div class="stop"><span class="sname">'+esc(s.name)+'</span>'
          + '<span class="smetric">'+esc(s.metric)
          + ' <button class="glean-citation" data-citation="customer_proof" aria-label="Show source" onclick="event.preventDefault();event.stopPropagation();">i</button>'
          + '</span></div>'
          + '<p class="sdesc">'+esc(s.desc)+'</p>'
          + '<span class="slink">Read the story</span></a>';
      }).join('');
      return '<div class="pillar">'
        + '<div class="pillar-top"><div class="pnum">'+esc(p.num)+'</div>'
        + '<div><div class="ptitle">'+esc(p.title)+'</div><p class="pgoal">'+esc(p.goal)+'</p></div></div>'
        + '<div class="pbody"><div class="pcol"><p class="colhead">How Glean does it</p><ul class="gl">'+how+'</ul></div>'
        + '<div class="pcol"><p class="colhead">See it in action</p><div class="stories">'+stories+'</div></div></div>'
        + '</div>';
    }).join('');

    var stats = (d.stats||[]).map(function(s){
      return '<div class="stat"><div class="n">'+esc(s.n)+'</div><div class="l">'+esc(s.l)+'</div></div>';
    }).join('');

    var attrib = (d.hero.attrib||[]).map(function(a){ return '<span>'+a+'</span>'; }).join('');
    var helpBullets = (d.help.bullets||[]).map(function(b){ return '<li>'+b+'</li>'; }).join('');

    var html = ''
      + '<div class="hero"><div class="wrap">'
      + '<p class="kicker rv d1">'+esc(d.hero.kicker)+'</p>'
      + '<h1 class="rv d2">'+esc(d.hero.title)+'</h1>'
      + '<p class="sub rv d3">'+esc(d.hero.lede)+'</p>'
      + '<div class="attrib rv d4">'+attrib+'</div>'
      + '</div></div>'
      + '<div class="wrap">'
      + '<div class="stats rv d5">'+stats+'</div>'
      + '<section><div class="sec-label">'+esc(d.throughline.label)+'</div>'
      + '<div class="throughline"><h2>'+esc(d.throughline.title)+'</h2>'
      + '<p>'+esc(d.throughline.p1)+'</p>'
      + '<div class="quote">'+esc(d.throughline.quote)+'</div>'
      + '<p>'+esc(d.throughline.p2)+'</p></div></section>'
      + '<section><div class="sec-label">Your four priorities, and how Glean helps</div>'+pillars+'</section>'
      + '<section><div class="sec-label">'+esc(d.help.label)+'</div>'
      + '<div class="help"><p class="lead">'+esc(d.help.lead)+'</p><ul class="gl">'+helpBullets+'</ul></div></section>'
      + '<section><div class="close"><h2>'+esc(d.close.title)+'</h2><p>'+esc(d.close.body)+'</p></div></section>'
      + '<p class="foot">'+esc(d.footer)+'</p>'
      + '</div>';
    document.getElementById('app').innerHTML = html;
  }

  document.addEventListener('DOMContentLoaded', function(){
    if(!window.APP_DATA || window.APP_DATA.error){
      document.getElementById('app').innerHTML = '<div class="no-data">Data unavailable.</div>';
      return;
    }
    renderApp(window.APP_DATA);
    try{
      window.GleanBridge.postMessage({ actionId:'export-pdf', type:'glean-add-menu', metadata:{ label:'Export as PDF', icon:'export' }});
      window.GleanBridge.onMessage('action', function(data){ if(data.actionId==='export-pdf') window.print(); });
    }catch(e){}
  });
</script>
</body>
